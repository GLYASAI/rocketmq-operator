broker:
  allowRestart: true
  image:
    repository: registry.sensetime.com/sensecore-infra/rocketmq-broker
    tag: 5.3.1-alpine-operator-0.4.0
    imagePullPolicy: IfNotPresent
  env:
    BROKER_MEM: ""
  hostNetwork: false
  size: 2
  resources:
    limits:
      cpu: 1000m
      memory: 4Gi
    requests:
      cpu: 250m
      memory: 1Gi
  storage:
    size: 8Gi
    storageClassName:

  config: |-
    # brokerClusterName, brokerName, brokerId are automatically generated by the operator and do not set it manually!!!
    deleteWhen=04
    fileReservedTime=48
    flushDiskType=ASYNC_FLUSH
    # set brokerRole to ASYNC_MASTER or SYNC_MASTER. DO NOT set to SLAVE because the replica instance will automatically be set!!!
    brokerRole=ASYNC_MASTER
    aclEnable=true
    slaveReadEnable=true
    diskMaxUsedSpaceRatio=85

  acl: |-
    accounts:
    - accessKey: RocketMQ
      secretKey: 123456789
      admin: false
      defaultTopicPerm: DENY
      defaultGroupPerm: SUB
      topicPerms:
        - topicA=DENY
        - topicB=PUB|SUB
        - topicC=SUB
      groupPerms:
        # the group should convert to retry topic
        - groupA=DENY
        - groupB=PUB|SUB
        - groupC=SUB
    - accessKey: rocketmq2
      secretKey: 123456789
      # if it is admin, it could access all resources
      admin: true

nameservice:
  image:
    repository: registry.sensetime.com/sensecore-infra/rocketmq-nameserver
    tag: 5.3.1-alpine-operator-0.4.0
    imagePullPolicy: IfNotPresent
  size: 1
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  storage:
    size: 1Gi
    storageClassName:


console:
  env:
    javaOpts: -Dspring.config.location=/apps/data/console/config/
  image:
    repository: registry.sensetime.com/sensecore-infra/rocketmq-dashboard
    tag: 2.0.1
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi  
  config:
    application: |-
      server:
        port: 8080
        servlet:
          encoding:
            charset: UTF-8
            enabled: true
            force: true
      spring:
        application:
          name: rocketmq-dashboard
      logging:
        config: classpath:logback.xml
      rocketmq:
        config:
          namesrvAddrs:
          - nameservice:9876
          isVIPChannel: true
          timeoutMillis:
          dataPath: /tmp/rocketmq-console/data
          enableDashBoardCollect: true
          msgTrackTopicName:
          ticketKey: ticket
          loginRequired: true
          useTLS: false
          accessKey: rocketmq2
          secretKey: 123456789
      threadpool:
        config:
          coreSize: 10
          maxSize: 10
          keepAliveTime: 3000
          queueSize: 5000
    rolePerms: |-
      ordinary:
      - /rocketmq/*.query
      - /ops/*.query
      - /dashboard/*.query
      - /topic/*.query
      - /producer/*.query
      - /message/*.query
      - /messageTrace/*.query
      - /monitor/*.query
      - /consumer/*.query
      - /cluster/*.query
      - /dlqMessage/*.query
      administrator:
      - /rocketmq/*.query
      - /ops/*.query
      - /dashboard/*.query
      - /topic/*.query
      - /topic/sendTopicMessage.do
      - /producer/*.query
      - /message/*.query
      - /messageTrace/*.query
      - /monitor/*.query
      - /consumer/*.query
      - /cluster/*.query
      - /dlqMessage/*.query
      - /dlqMessage/exportDlqMessage.do
      - /dlqMessage/batchResendDlqMessage.do
    users:
    - username: admin
      password: "12345678"
      admin: true
    - username: guest
      password: "12345678"

