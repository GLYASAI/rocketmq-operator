apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocketmq.fullname" . }}-config
  labels:
  {{- include "rocketmq.labels" . | nindent 4 }}
data:
  broker-common.conf: {{ .Values.broker.config | toYaml | indent 1 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocketmq.fullname" . }}-acl-config
  labels:
  {{- include "rocketmq.labels" . | nindent 4 }}
data:
  plain_acl.yml: {{ .Values.broker.acl | toYaml | indent 1 }}
---
apiVersion: rocketmq.apache.org/v1alpha1
kind: Broker
metadata:
  name: {{ .Release.Name }}-broker
  labels:
  {{- include "rocketmq.labels" . | nindent 4 }}
spec:
  allowRestart: {{ .Values.broker.allowRestart }}
  brokerImage: {{ .Values.broker.image.repository }}:{{ .Values.broker.image.tag | default .Chart.AppVersion }}
  env:
  - name: BROKER_MEM
    value: "{{ .Values.broker.env.BROKER_MEM }}"
  hostNetwork: {{ .Values.broker.hostNetwork }}
  hostPath: /data/rocketmq/broker
  size: {{ .Values.broker.size }}
  imagePullPolicy: {{ .Values.broker.image.imagePullPolicy }}
  replicaPerGroup: 1
  resources:
    {{- toYaml .Values.broker.resources | nindent 4 }}
  scalePodName: broker-0-master-0
  storageMode: StorageClass
  volumeClaimTemplates:
  - metadata:
      name: broker-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.broker.storage.size }}
      storageClassName: {{  .Values.broker.storage.storageClassName }}
  volumes:
  - configMap:
      items:
      - key: broker-common.conf
        path: broker-common.conf
      name: broker-config
    name: {{ include "rocketmq.fullname" . }}-config
  - configMap:
      items:
      - key: plain_acl.yml
        path: plain_acl.yml
      name: broker-acl-config
    name: {{ include "rocketmq.fullname" . }}-acl-config