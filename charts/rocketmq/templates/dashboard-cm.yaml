apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocketmq.fullname" . }}-console-config
  labels:
  {{- include "rocketmq.labels" . | nindent 4 }}
data:
  application.yml: {{ .Values.console.config.application | toYaml | indent 2 }}
  role-permission.yml: {{ .Values.console.config.rolePerms | toYaml | indent 2 }}
  users.properties: |-
{{- range .Values.console.config.users }}
    {{ .username }}={{ .password }},{{ if .admin }}1{{ else }}0{{ end }}
{{- end }}
